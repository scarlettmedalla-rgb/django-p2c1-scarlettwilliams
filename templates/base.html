<!-- templates/base.html -->
{% load django_bootstrap5 %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}EcoEnergy{% endblock %}</title>

    {% bootstrap_css %}

    <style>
        /* ==============================
           ANIMACIÓN DEL DEGRADADO
        ============================== */
        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* ==============================
           NAVBAR PRINCIPAL
        ============================== */
        .navbar-gradient-pink {
            background:
                linear-gradient(
                    120deg,
                    #8e2de2,
                    #ff1493,
                    #ff4f81,
                    #ff758c,
                    #ff7eb3
                ) !important;

            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;

            border-radius: 18px !important;

            box-shadow:
                0 10px 30px rgba(255, 20, 147, 0.30),
                0 0 25px rgba(255, 117, 140, 0.15);

            border: 1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(10px);

            padding-top: 10px;
            padding-bottom: 10px;
        }

        /* ==============================
           LOGO
        ============================== */
        .navbar-brand {
            color: white !important;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 0.5px;

            transition: all 0.3s ease;
        }

        .navbar-brand:hover {
            transform: scale(1.05);
            text-shadow:
                0 0 10px rgba(255,255,255,0.8),
                0 0 20px rgba(255,255,255,0.5);
        }

        .brand-energy {
            color: #ffe6f2;
            text-shadow: 0 0 10px rgba(255,255,255,0.6);
        }

        /* ==============================
           LINKS DEL NAV
        ============================== */
        .navbar-nav {
            gap: 8px;
        }

        .nav-link {
            position: relative;

            color: white !important;

            font-weight: 600;
            font-size: 1rem;

            padding: 10px 18px !important;

            border-radius: 12px;

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;
        }

        /* Fondo al pasar el mouse */
        .nav-link:hover,
        .nav-link.active {
            color: white !important;

            background: rgba(255, 255, 255, 0.18);

            box-shadow:
                0 4px 15px rgba(255,255,255,0.15);

            transform: translateY(-2px);
        }

        /* Línea inferior */
        .nav-link::after {
            content: "";

            position: absolute;

            width: 0;
            height: 3px;

            left: 50%;
            bottom: 5px;

            border-radius: 10px;

            background: white;

            box-shadow:
                0 0 8px rgba(255,255,255,0.9);

            transition: all 0.3s ease;
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 45%;
            left: 27.5%;
        }

        /* ==============================
           BOTÓN HAMBURGUESA
        ============================== */
        .navbar-toggler {
            border: 1px solid rgba(255,255,255,0.6);

            border-radius: 10px;

            padding: 7px 10px;

            box-shadow:
                0 0 10px rgba(255,255,255,0.15);

            transition: all 0.3s ease;
        }

        .navbar-toggler:hover {
            background: rgba(255,255,255,0.15);

            transform: scale(1.05);
        }

        .navbar-toggler:focus {
            box-shadow:
                0 0 0 3px rgba(255,255,255,0.2);
        }

        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255,255,255,1%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        /* ==============================
           EFECTO DE BRILLO
        ============================== */
        .navbar-gradient-pink::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border-radius: 18px;

            background:
                linear-gradient(
                    120deg,
                    rgba(255,255,255,0.15),
                    transparent 40%,
                    rgba(255,255,255,0.08)
                );

            pointer-events: none;
        }

        /* ==============================
           RESPONSIVE
        ============================== */
        @media (max-width: 991px) {

            .navbar-gradient-pink {
                padding-left: 15px !important;
                padding-right: 15px !important;
            }

            .navbar-nav {
                margin-top: 12px;

                padding: 10px;

                border-radius: 15px;

                background: rgba(255,255,255,0.08);

                backdrop-filter: blur(8px);
            }

            .nav-link {
                text-align: center;
            }
        }
    </style>
</head>

<body class="container py-4">

    <!-- ==============================
         NAVBAR
    ============================== -->

    <nav class="navbar navbar-expand-lg navbar-gradient-pink px-4 mb-4">

        <div class="container-fluid">

            <!-- LOGO -->
            <a class="navbar-brand"
               href="{% url 'dispositivos:inicio' %}">

                ⚡ Eco<span class="brand-energy">Energy</span>

            </a>

            <!-- BOTÓN MÓVIL -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#electricNavbar"
                aria-controls="electricNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- ENLACES -->
            <div
                class="collapse navbar-collapse justify-content-end"
                id="electricNavbar">

                <ul class="navbar-nav">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{% url 'dispositivos:inicio' %}">

                            🏠 Inicio

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{% url 'dispositivos:catalogo' %}">

                            ⚡ Dispositivos

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- ==============================
         CONTENIDO PRINCIPAL
    ============================== -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    {% bootstrap_javascript %}

</body>
</html>

{% load django_bootstrap5 %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}EcoEnergy{% endblock %}</title>
    {% bootstrap_css %}
</head>
<body class="bg-light">
    <!-- Navbar accesible -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'zonas_listado' %}">ECOENERGY</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'zonas_listado' %}">Inicio</a>
                <a class="nav-link" href="{% url 'zonas_listado' %}">Zonas</a>
                
                <!-- ESTE ES EL NUEVO ENLACE REQUERIDO EN LA FASE 2 -->
                <a class="nav-link" href="{% url 'resumen_zonas' %}">Resumen</a>
            </div>
        </div>
    </nav>

    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

    {% bootstrap_javascript %}
</body>
</html>
